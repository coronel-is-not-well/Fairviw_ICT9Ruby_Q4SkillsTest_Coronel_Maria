<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Mozilla+Text:wght@200..700&display=swap" rel="stylesheet">

<style>

#Log{padding: 20px;
    margin: 50px;
    background-color:rgb(255, 255, 255);
    border-radius: 10%;
    width: 300px;
    height: auto;
    color: rgb(0, 0, 0);
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.747), 0 6px 20px 0 rgba(0, 0, 0, 0.747);
    font-family: "Comic Neue";
}

body{background-image: url(https://wallpaperaccess.com/full/1673354.jpg);
background-repeat: no-repeat;
        background-size: cover;}

</style>


</head>
<body>

    <div id="Log">

    <img src="https://logos-world.net/wp-content/uploads/2022/01/Umbrella-Academy-Symbol.png" style="height: 100px; width: auto; margin: 0 auto; display: block;">
   
    <h2 style="font-family: Mozilla Text;">Log In</h2>

<details class="ontoggle">
        <summary>Help</summary>
       
        <p id="instruct">
          Input the indicated username and password, then click 'Log In' to proceed.
        </p>
</details>

<br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" placeholder="five@gmail.com">

<br><br>

<label for="password">Password:</label><br>
<input type="password" id="password" name="password" placeholder="Delor3s">

<br><br>

<input type="checkbox" id="stay" name="stay" value="stay">
<label for="stay">Remember me</label>

<br><br>
<button onclick="login()">Log In</button>

<p id="message"></p>

</div>


    
    <script>
//Use if-else statement for username and password verification. Use  === comparison operator and AND operator to check if condition is TRUE.


//Use Switch Code for the checkbox

function login(){ 
    
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var result;

    if (email === "five@gmail.com" && password === "Delor3s")
    result = true;
    else
    result = false;

    let stay= document.getElementById("stay").checked; 
         //when checked, it reads true

        switch(result) {
            case true:
                alert("Successfully logged in!");
                window.location.href = "notebook.html";
            break;

            case false:
                document.getElementById("message").innerHTML = "Email or password incorrect.";
            break;

            //default may almost never needed since there is already true and false statement;
 }




}


</script>

</body>
</html>
